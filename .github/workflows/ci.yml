name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  # SAD §13 job 1 — backend pytest (sqlite fallback, no services needed).
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      AUDIT_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not live" -q

  # SAD §13 job 2 — frontend lint + typecheck + vitest + build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build

  # SAD §13 job 3 — Playwright e2e: boots Django, seeds a tenant, runs the
  # live suite (playwright.live.config.ts, facility ci-yard, PIN TRK-CI-1).
  e2e:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      AUDIT_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Boot Django + seed tenant
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > django.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health/ && break; sleep 1; done
          SIGNUP=$(curl -sf -X POST http://127.0.0.1:8000/api/tenancy/signup/ \
            -H 'Content-Type: application/json' \
            -d '{"organisation_name":"CI Fleet","facility_name":"CI Yard","facility_mode":"DEMO","username":"ciadmin","password":"ci-pass-12345","email":"ci@example.com"}')
          TOKEN=$(echo "$SIGNUP" | python -c "import sys,json;print(json.load(sys.stdin)['token'])")
          FAC_ID=$(echo "$SIGNUP" | python -c "import sys,json;print(json.load(sys.stdin)['facility']['id'])")
          curl -sf -X POST http://127.0.0.1:8000/api/admin/pins/ \
            -H "Authorization: Token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"staff_id\":\"TRK-CI-1\",\"pin\":\"1234\",\"role\":\"DISPATCH_SUPERVISOR\",\"facility_id\":\"$FAC_ID\"}"
          curl -sf -X POST http://127.0.0.1:8000/api/admin/seed/ \
            -H "Authorization: Token $TOKEN" -H 'Content-Type: application/json' \
            -d '{"facility":"ci-yard"}'
      - name: Playwright live e2e
        working-directory: web
        run: npx playwright test --config playwright.live.config.ts
      - name: Versioned inspection UI contract
        working-directory: web
        run: npx playwright test --config playwright.regulatory.config.ts
      - name: User-story browser journeys against isolated Django API
        working-directory: backend
        env:
          RUN_STORY_BROWSER: '1'
        run: python -m pytest tests/test_story_browser.py -q
