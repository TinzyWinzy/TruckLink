# PowerSync Sync Rules for BAK OpShield
# Partitions data by facility_id and user role

bucket_definitions:
  # Facility data stream
  facility_data:
    parameters: select request.jwt() ->> 'facility_id' as facility_id
    data:
      - select * from facilities where id = bucket.facility_id
      - select * from queue_entries where facility_id = bucket.facility_id
      - select * from docks where facility_id = bucket.facility_id
      - select * from compliance_checks where facility_id = bucket.facility_id
      - select * from alerts where facility_id = bucket.facility_id
      - select * from audit_logs where facility_id = bucket.facility_id
      - select * from equipment where facility_id = bucket.facility_id

  # Global / User metadata
  user_metadata:
    parameters: select request.user_id() as user_id
    data:
      - select * from users where id = bucket.user_id
