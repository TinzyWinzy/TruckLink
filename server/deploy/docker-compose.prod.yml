# Staging overlay: loop back data-plane ports, add Caddy at the edge.
# Usage (on VM1): docker compose -f ../docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Only 80/443 are public. Postgres/RabbitMQ/management listen on 127.0.0.1.
# Production NEVER runs with the base file's dev defaults: the `:?` substitutes
# fail the compose launch when the secrets aren't set in the host `.env`.
services:
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env for prod}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env for prod}

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for prod}

  api:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for prod (postgresql://root:<pg-pw>@postgres:5432/bak_logistics)}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env for prod (amqp://<user>:<pw>@rabbitmq:5672)}
      NODE_ENV: production

  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for prod}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env for prod}
      NODE_ENV: production

  relay:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for prod}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env for prod}
      NODE_ENV: production

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
